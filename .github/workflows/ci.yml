name: ci

# One job, named ci: the org ruleset requires a check with that name. It runs the whole gate, so the required check
# covers typecheck, bundle, unit, the conformance fixture, the real 2.4.1 host, pack, and plugin-kit check (T0/T1, docs
# drift and the forbidden scan). The bundle guard fails when the committed dist/ is stale.
#
# It runs locally too: npm ci --ignore-scripts && npm run check
#
# Public repository: every job asks for the org's public runner, `boxd-public`, by name. A pull request from a fork
# waits for approval before it runs there, so it never reaches the runner unreviewed.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: boxd-public
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          # The self-hosted runner's restored Bun cache lands outside its HOME, so download Bun instead.
          no-cache: true
      - name: Fetch the contract over HTTPS
        # The contract is a public repository, and npm records its GitHub dependency over ssh. A runner has no key.
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # OpenCode installs plugins without lifecycle scripts, and no dev dependency needs them.
      - run: npm ci --ignore-scripts
      - name: Prove the committed bundle is current
        run: npm run bundle && git diff --exit-code dist/
      # Typecheck, bundle, unit, conformance fixtures, the real 2.4.1 host, pack, then `plugin-kit check`.
      - run: npm run check
