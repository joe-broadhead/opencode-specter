name: release

# The tag is cut by `plugin-kit release <version>` on a clean, level master and pushed by the maintainer. This workflow
# builds that tag, checks it again, and publishes the GitHub release with dist/, the packed tarball, SHA256SUMS and the
# conformance report attached. It never edits the tag or the version and never pushes elsewhere.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: publish the release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: npm ci --ignore-scripts
      - name: Check the tagged tree
        run: npm run check
      - name: Keep the release files
        run: |
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          cp dist/index.js release/index.js
          npx plugin-kit conformance --json > release/conformance-report.json
      - name: Write SHA256SUMS
        run: |
          cd release
          find . -type f ! -name SHA256SUMS | sed 's#^\./##' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-from-tag release/*
